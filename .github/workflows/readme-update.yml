name: README Update

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  test-source-change:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pytest
        run: pytest -q

      - name: Update README
        run: |
          python -c "from src.automated_documentation_sync.sync import sync_readme; sync_readme()"
